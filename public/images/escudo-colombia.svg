<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Escudo de Colombia - Versión institucional simplificada -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#DAA520"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo del escudo -->
  <path d="M50 5 L95 25 L95 75 Q95 95 50 115 Q5 95 5 75 L5 25 Z" fill="url(#gold)" stroke="#8B7355" stroke-width="2"/>
  
  <!-- Franja superior (azul) -->
  <path d="M50 5 L95 25 L5 25 Z" fill="#003893"/>
  
  <!-- Franja media (roja) -->
  <path d="M5 25 L95 25 L95 45 Q50 55 5 45 Z" fill="#CE1126"/>
  
  <!-- Franja inferior (amarilla) -->
  <path d="M5 45 Q50 55 95 45 L95 75 Q95 95 50 115 Q5 95 5 75 Z" fill="#FCD116"/>
  
  <!-- Gorro frigio (símbolo de libertad) -->
  <path d="M45 35 L50 28 L55 35 L50 38 Z" fill="#CE1126"/>
</svg>
